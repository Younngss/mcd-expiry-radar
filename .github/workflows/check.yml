name: Verify radar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python radar.py demo
      - run: python scripts/check_release.py
